[project]
name = "pmm"
version = "0.1.0"
description = "Distilling agent knowledge into System One workflows with graph memory: PMM demo"
requires-python = ">=3.12"
dependencies = [
    "neo4j-agent-memory[nams,mcp]==0.6.0",
    "mcp>=2,<3",
    "typesafe-sdk==0.7.2",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "neo4j>=5.20",
]

[project.scripts]
pmm = "pmm.cli:main"
pmm-tools = "pmm.mcp_server:main"
pmm-hook = "pmm.hooks:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
