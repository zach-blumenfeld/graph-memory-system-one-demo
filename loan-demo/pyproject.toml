[project]
name = "loan"
version = "0.1.0"
description = "Business-loan demo: five bank systems -> neo4j-agent-memory (bolt), Claude Code traces, AIP skill"
requires-python = ">=3.12"
dependencies = [
    "neo4j-agent-memory==0.6.0",
    "neo4j>=5.20",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
loan = "loan.cli:app"
loan-hook = "loan.hooks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loan"]

[dependency-groups]
dev = ["pytest>=8"]
